services:
  pricing-engine:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENGINE_WORKERS: "2"
      MARKET_TICK_INTERVAL: "0.25"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

