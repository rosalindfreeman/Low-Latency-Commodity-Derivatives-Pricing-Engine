[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "commodity-pricing-engine"
version = "1.0.0"
description = "Low-latency commodity derivatives pricing engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
commodity-engine = "commodity_engine.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/commodity_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

